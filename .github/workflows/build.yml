name: Збірка застосунку

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact: macos
          - os: windows-latest
            artifact: windows
          - os: ubuntu-latest
            artifact: linux
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Самоперевірка аналітики
        run: node lib/analytics.test.mjs

      # Параметри, які приймають не всі моделі: Kimi вимагає temperature
      # рівно 1, нові моделі OpenAI не знають max_tokens. Застосунок має
      # помічати відмову й повторювати запит без проблемного параметра.
      - name: Самоперевірка параметрів моделей
        run: node lib/providers.test.mjs

      # Перелік файлів — основа модульних оновлень. Якщо він застарів,
      # користувачі отримають оновлення, які не збігаються з кодом.
      - name: Перевірити, що перелік файлів актуальний
        if: matrix.artifact == 'linux'
        run: node scripts/make-manifest.mjs --check

      - name: Завантажити yt-dlp
        shell: bash
        run: |
          mkdir -p bin
          if [ "${{ matrix.artifact }}" = "windows" ]; then
            curl -fL -o bin/yt-dlp.exe https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe
          elif [ "${{ matrix.artifact }}" = "macos" ]; then
            curl -fL -o bin/yt-dlp https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp_macos
            chmod +x bin/yt-dlp
          else
            curl -fL -o bin/yt-dlp https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp
            chmod +x bin/yt-dlp
          fi

      - name: Встановити залежності збірки
        run: npm install --no-audit --no-fund

      - name: Зібрати (macOS)
        if: matrix.artifact == 'macos'
        run: npx electron-builder --mac --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Зібрати (Windows)
        if: matrix.artifact == 'windows'
        run: npx electron-builder --win --publish never

      - name: Зібрати (Linux)
        if: matrix.artifact == 'linux'
        run: npx electron-builder --linux --publish never

      # архів збирається на Linux-раннері: вміст той самий, але там гарантовано є zip
      - name: Портативна версія для Windows
        if: matrix.artifact == 'linux'
        shell: bash
        run: bash desktop/windows/build-portable.sh

      # ── Запобіжник ──────────────────────────────────────────────────────
      # У версії 1.0.1 застосунок поїхав до людей без робочих даних: yt-dlp
      # лежав у <resources>/bin, а сервер шукав його в <resources>/app/bin.
      # Тепер збірка ПАДАЄ, якщо бінарника немає там, де його очікує сервер,
      # або якщо сервер його не бачить. Краще зупинити реліз, ніж віддати
      # користувачам порожній застосунок.
      - name: Перевірити, що yt-dlp долетів у збірку
        if: matrix.artifact != 'windows'
        shell: bash
        run: |
          set -e
          case "${{ matrix.artifact }}" in
            macos)  APP="dist/mac-arm64/Cartel Radar.app/Contents/Resources" ;;
            linux)  APP="dist/linux-unpacked/resources" ;;
          esac
          echo "перевіряю $APP/bin"
          ls -la "$APP/bin" || { echo "::error::Теки bin немає у збірці"; exit 1; }
          test -x "$APP/bin/yt-dlp" || { echo "::error::yt-dlp відсутній або не виконуваний"; exit 1; }

          export CARTEL_RADAR_DATA="$(mktemp -d)/data"
          node "$APP/app/server.mjs" --port 8899 &
          SRV=$!
          trap 'kill $SRV 2>/dev/null || true' EXIT
          for i in $(seq 1 40); do sleep 1; curl -sf -m 3 http://127.0.0.1:8899/api/health >/dev/null && break; done

          echo "перевіряю, що сервер із цієї збірки бачить yt-dlp"
          RESP=$(curl -s -m 8 http://127.0.0.1:8899/api/sources)
          case "$RESP" in
            *'"ytdlp":true'*) echo "  OK: бачить yt-dlp" ;;
            *) echo "::error::Сервер у зібраній програмі НЕ бачить yt-dlp. Саме ця помилка зламала реліз 1.0.1."; echo "$RESP"; exit 1 ;;
          esac

          # Кожен файл інтерфейсу мусить бути в збірці й віддаватися як JavaScript.
          # У 1.0.2 файл public/data/markets.js не потрапив у репозиторій (його
          # випадково виключав .gitignore), і сторінка відкривалася мертвою:
          # браузер відмовлявся виконувати модуль, який прийшов як text/html.
          echo "перевіряю, що всі файли інтерфейсу на місці"
          BROKEN=0
          while read -r rel; do
            [ -n "$rel" ] || continue
            CT=$(curl -s -o /dev/null -w '%{content_type}' -m 5 "http://127.0.0.1:8899/$rel")
            case "$CT" in
              *javascript*) ;;
              *) echo "::error::У збірці немає /$rel — сервер віддав '$CT' замість JavaScript. Інтерфейс буде мертвий."; BROKEN=1 ;;
            esac
          done < <(cd public && find . -name '*.js' | sed 's|^\./||' | sort)
          [ "$BROKEN" = "0" ] || exit 1
          echo "  OK: усі файли інтерфейсу віддаються"

          # і головна сторінка теж
          curl -sf -m 5 http://127.0.0.1:8899/ | grep -q 'Cartel Radar' || { echo "::error::Головна сторінка не відкривається"; exit 1; }
          echo "  OK: головна сторінка відкривається"

      - name: Завантажити результати
        uses: actions/upload-artifact@v4
        with:
          name: cartel-radar-${{ matrix.artifact }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
            dist/*.AppImage
          if-no-files-found: warn

      # Готові інсталятори одразу їдуть у реліз — без ручного завантаження
      # артефактів із раннера. Спрацьовує лише на тег (v1.0.1 і далі).
      - name: Прикріпити до релізу
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
            dist/*.AppImage
          fail_on_unmatched_files: false
