name: Збірка застосунку

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact: macos
          - os: windows-latest
            artifact: windows
          - os: ubuntu-latest
            artifact: linux
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Самоперевірка аналітики
        run: node lib/analytics.test.mjs

      - name: Завантажити yt-dlp
        shell: bash
        run: |
          mkdir -p bin
          if [ "${{ matrix.artifact }}" = "windows" ]; then
            curl -fL -o bin/yt-dlp.exe https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe
          elif [ "${{ matrix.artifact }}" = "macos" ]; then
            curl -fL -o bin/yt-dlp https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp_macos
            chmod +x bin/yt-dlp
          else
            curl -fL -o bin/yt-dlp https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp
            chmod +x bin/yt-dlp
          fi

      - name: Встановити залежності збірки
        run: npm install --no-audit --no-fund

      - name: Зібрати (macOS)
        if: matrix.artifact == 'macos'
        run: npx electron-builder --mac --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Зібрати (Windows)
        if: matrix.artifact == 'windows'
        run: npx electron-builder --win --publish never

      - name: Зібрати (Linux)
        if: matrix.artifact == 'linux'
        run: npx electron-builder --linux --publish never

      # архів збирається на Linux-раннері: вміст той самий, але там гарантовано є zip
      - name: Портативна версія для Windows
        if: matrix.artifact == 'linux'
        shell: bash
        run: bash desktop/windows/build-portable.sh

      # ── Запобіжник ──────────────────────────────────────────────────────
      # У версії 1.0.1 застосунок поїхав до людей без робочих даних: yt-dlp
      # лежав у <resources>/bin, а сервер шукав його в <resources>/app/bin.
      # Тепер збірка ПАДАЄ, якщо бінарника немає там, де його очікує сервер,
      # або якщо сервер його не бачить. Краще зупинити реліз, ніж віддати
      # користувачам порожній застосунок.
      - name: Перевірити, що yt-dlp долетів у збірку
        if: matrix.artifact != 'windows'
        shell: bash
        run: |
          set -e
          case "${{ matrix.artifact }}" in
            macos)  APP="dist/mac-arm64/Cartel Radar.app/Contents/Resources" ;;
            linux)  APP="dist/linux-unpacked/resources" ;;
          esac
          echo "перевіряю $APP/bin"
          ls -la "$APP/bin" || { echo "::error::Теки bin немає у збірці"; exit 1; }
          test -x "$APP/bin/yt-dlp" || { echo "::error::yt-dlp відсутній або не виконуваний"; exit 1; }

          echo "перевіряю, що сервер із цієї збірки справді бачить yt-dlp"
          export CARTEL_RADAR_DATA="$(mktemp -d)/data"
          node "$APP/app/server.mjs" --port 8899 &
          SRV=$!
          for i in $(seq 1 30); do sleep 1; curl -sf -m 3 http://127.0.0.1:8899/api/health >/dev/null && break; done
          RESP=$(curl -sf -m 5 http://127.0.0.1:8899/api/sources)
          kill $SRV 2>/dev/null || true
          echo "$RESP"
          case "$RESP" in
            *'"ytdlp":true'*) echo "OK: збірка бачить yt-dlp" ;;
            *) echo "::error::Сервер у зібраній програмі НЕ бачить yt-dlp. Саме ця помилка зламала реліз 1.0.1."; exit 1 ;;
          esac

      - name: Завантажити результати
        uses: actions/upload-artifact@v4
        with:
          name: cartel-radar-${{ matrix.artifact }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
            dist/*.AppImage
          if-no-files-found: warn

      # Готові інсталятори одразу їдуть у реліз — без ручного завантаження
      # артефактів із раннера. Спрацьовує лише на тег (v1.0.1 і далі).
      - name: Прикріпити до релізу
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
            dist/*.AppImage
          fail_on_unmatched_files: false
